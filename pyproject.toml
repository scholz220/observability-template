[project]
name = "base16-hex-pair"
version = "0.1.0"
description = "Encodes bytes to a hexadecimal string and decodes hex pairs back to bytes, ignoring whitespace and validating character ranges."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
